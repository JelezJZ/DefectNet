<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Dashboard - PCB Defect Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/dashboard_style.css">
    <link rel="stylesheet" href="css/index_style.css">
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-brand">🔍 PCB Defect Detection</div>
        <ul class="navbar-menu">
            <li><a href="/">Детекция</a></li>
            <li><a href="/">Пакетная обработка</a></li>
            <li><a href="/">История</a></li>
            <li><a href="/">Модели</a></li>
            <li><a href="/dashboard" class="active">Аналитика</a></li>
        </ul>
        <div class="user-menu">
            <div class="user-avatar" id="userAvatar">U</div>
            <span id="username">Guest</span>
            <button class="btn btn-secondary" onclick="logout()" id="logoutBtn" style="display: none; padding: 8px 20px; margin: 0;">Выйти</button>
            <button class="btn" onclick="showLoginForm()" id="loginBtn" style="padding: 8px 20px; margin: 0;">Войти</button>
        </div>
    </div>

    <div class="dashboard-container">

        <div class="card">
            <h3>Всего проверок</h3>
            <div class="metric">
                <div class="metric-value" id="totalInspections">0</div>
                <div class="metric-label">Все время</div>
            </div>
        </div>

        <div class="card">
            <h3>Обнаружены дефекты</h3>
            <div class="metric">
                <div class="metric-value" id="totalDefects">0</div>
                <div class="metric-label">Всего дефектов</div>
            </div>
        </div>

        <div class="card">
            <h3>Проходной балл</h3>
            <div class="metric">
                <div class="metric-value" id="passRate">0%</div>
                <div class="metric-label">Уровень успеха</div>
            </div>
        </div>

        <div class="card grid-2">
            <h3>Дефекты по типу</h3>
            <div class="chart-container">
                <canvas id="defectsChart"></canvas>
            </div>
        </div>

        <div class="card grid-2">
            <h3>График проверок</h3>
            <div class="chart-container">
                <canvas id="timelineChart"></canvas>
            </div>
        </div>

        <div class="card grid-2">
            <h3>Недавняя активность</h3>
            <div class="activity-feed" id="activityFeed">
            </div>
        </div>
    </div>

    <!-- Inspection Detail Modal -->
    <div id="inspectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 Детали инспекции</h3>
                <span class="modal-close" onclick="closeInspectionModal()">&times;</span>
            </div>
            <div class="modal-body" id="inspectionModalBody">
                <div style="text-align: center; padding: 40px;">
                    <div class="spinner"></div>
                    <p>Загрузка...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/dashboard_script.js"></script>
</body>
</html>
