<!-- frontend/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Defect Detection</title>
    <style>
        body { 
            font-family: Arial; 
            max-width: 900px; 
            margin: 50px auto; 
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .image-box {
            border: 2px solid #ddd;
            padding: 10px;
            border-radius: 5px;
        }
        .image-box h3 {
            margin-top: 0;
            color: #333;
        }
        img { 
            max-width: 100%; 
            border-radius: 5px;
        }
        .result { 
            background: #f0f0f0; 
            padding: 15px; 
            margin: 10px 0;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .controls {
            margin: 20px 0;
        }
        #loading {
            display: none;
            color: #007bff;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 Defect Detection System</h1>
    
    <div class="controls">
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="detectDefects()" id="analyzeBtn">Analyze</button>
        <div id="loading">⏳ Processing...</div>
    </div>
    
    <div class="container">
        <div class="image-box">
            <h3>Original Image</h3>
            <img id="originalPreview" style="display:none">
        </div>
        <div class="image-box">
            <h3>Detection Results</h3>
            <img id="resultPreview" style="display:none">
        </div>
    </div>
    
    <div id="results"></div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const originalPreview = document.getElementById('originalPreview');
        const resultPreview = document.getElementById('resultPreview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                originalPreview.src = URL.createObjectURL(file);
                originalPreview.style.display = 'block';
                resultPreview.style.display = 'none';
                document.getElementById('results').innerHTML = '';
            }
        });

        async function detectDefects() {
            const file = imageInput.files[0];
            if (!file) {
                alert('Please select an image');
                return;
            }

            // Показываем индикатор загрузки
            loading.style.display = 'block';
            analyzeBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://localhost:8000/detect', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const imageUrl = URL.createObjectURL(blob);
                    
                    resultPreview.src = imageUrl;
                    resultPreview.style.display = 'block';
                    
                    // Можно добавить дополнительный вызов для получения JSON с деталями
                    displaySuccess();
                } else {
                    alert('Error processing image');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error connecting to server');
            } finally {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        }

        function displaySuccess() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="result">
                    ✅ <strong>Detection completed successfully!</strong><br>
                    Check the image on the right to see detected defects.
                </div>
            `;
        }
    </script>
</body>
</html>
